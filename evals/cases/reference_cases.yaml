    input: {application_id: SPECIMEN-APP-5192, fault: null}
    expected: {status: MISSING_DATA, reasons: ["MISSING_DOCUMENT:PROOF_OF_ADDRESS"]}
    requirement_id: R2
    case_type: failure
    probe: MISSING_DOCUMENT
    rationale: "No proof-of-address document; pending, with no recommendation"
    taxonomy_tag: never_do_violation
    category: final_answer
    hard_rule: H7
    severity_if_failed: Critical

  - eval_id: EV-0206
    input: {application_id: SPECIMEN-APP-5191, fault: null}
