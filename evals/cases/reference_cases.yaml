    taxonomy_tag: never_do_violation
    category: state_change
    expected_state:
      review_cases: 2
      review_case_reasons: [HIGH_RISK_JURISDICTION, PEP_PARTY]
    hard_rule: H2
    severity_if_failed: Critical
