    expected: {status: COMPLIANCE_REVIEW, reasons: [NO_BENEFICIAL_OWNER_IDENTIFIED]}
    requirement_id: R3
    case_type: edge
    probe: NO_BENEFICIAL_OWNER_IDENTIFIED
    rationale: "Nobody owns 25 percent or more"
    taxonomy_tag: wrong_route
    category: final_answer
    hard_rule: null
