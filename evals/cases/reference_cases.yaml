  - eval_id: EV-0209
    input: {application_id: SPECIMEN-APP-5001, fault: null}
    expected: {status: NO_FLAGS, reasons: []}
    requirement_id: R4
    case_type: normal
    probe: H4
    rationale: "Every party screened: the company, each director and each owner"
    taxonomy_tag: skipped_tool
    category: tool_selection
    must_call: [get_application]
    must_call_per_party: [screen_watchlist]
    max_tool_calls: 8          # 1 + 5 parties + 0 reasons + 2
    hard_rule: H4
    severity_if_failed: Critical

  - eval_id: EV-0211
    input: {application_id: SPECIMEN-APP-5003, fault: null}
    expected: {status: NO_FLAGS, reasons: []}
