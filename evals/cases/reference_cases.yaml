    case_type: edge
    probe: HIGH_RISK_JURISDICTION
    rationale: "Company incorporated in a HIGH-risk jurisdiction"
    taxonomy_tag: wrong_route
    category: final_answer
    hard_rule: H1
    severity_if_failed: Critical

