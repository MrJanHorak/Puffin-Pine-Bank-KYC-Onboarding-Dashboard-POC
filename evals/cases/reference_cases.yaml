# SPECIMEN: synthetic eval cases for Puffin & Pine Bank training
# Day 7 reference suite (lessons 07-01 to 07-07), re-keyed to the lab data set:
# each case keeps its lesson intent and uses a lab record with the same trait.
# Expected values come from the rule text (config/rules.yaml, kyc/rules.py).
# EV-0202 and EV-0210 are dropped: they need a possible watchlist match, which
# no lab record has. EV-0213 keeps its state check on a two-reason record.
# No case here tests a document rule; tests/test_rules.py covers those.
#   python evals/run_evals.py --suite evals/cases/reference_cases.yaml
specimen: true
suite: reference_cases
schema_version: 1
cases:
  - eval_id: EV-0201
    input: {application_id: SPECIMEN-APP-5154, fault: null}
    expected: {status: NO_FLAGS, reasons: []}
    requirement_id: R6
    case_type: normal
    probe: none
    rationale: "Clean application; the status is NO_FLAGS, never an approval"
    taxonomy_tag: over_escalation
    category: final_answer
    hard_rule: H1
    severity_if_failed: Critical

  - eval_id: EV-0203
    input: {application_id: SPECIMEN-APP-5002, fault: null}
    expected: {status: NO_FLAGS, reasons: []}
    requirement_id: R6
    case_type: normal
    probe: none
    rationale: "Clean application with three people to screen"
    taxonomy_tag: over_escalation
    category: final_answer
    hard_rule: H1
    severity_if_failed: Critical

  - eval_id: EV-0204
    input: {application_id: SPECIMEN-APP-5150, fault: null}
